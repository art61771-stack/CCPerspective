name: build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos and iOS SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          curl -fsSL https://github.com/theos/sdks/archive/master.zip -o /tmp/sdks.zip
          unzip -q /tmp/sdks.zip -d /tmp
          cp -R /tmp/sdks-master/. "$HOME/theos/sdks/"
          brew install ldid dpkg
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"
      - name: Build rootless package
        run: |
          make clean
          make package FINALPACKAGE=1
      - name: Show package tree and Info.plist
        if: always()
        run: |
          DEB=$(find packages -name '*.deb' -print -quit)
          echo "deb=$DEB"
          dpkg-deb -c "$DEB" | cat
          rm -rf /tmp/data && mkdir -p /tmp/data
          dpkg-deb -x "$DEB" /tmp/data
          find /tmp/data -type f -print | cat
          BUNDLE=/tmp/data/var/jb/Library/ControlCenter/Bundles/CCPerspective.bundle
          ls -la "$BUNDLE" | cat
          echo "--- shipped plist ---"
          cat "$BUNDLE/Info.plist" || true
          echo "--- host plist ---"
          cat "$BUNDLE"/../*.plist 2>/dev/null || true
          find .theos -name 'Info.plist' -print 2>/dev/null | cat
